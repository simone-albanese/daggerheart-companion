<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Daggerheart Companion</title>
    <meta
      name="description"
      content="Offline character sheet and GM tools for Daggerheart. Local-first, no account, no network."
    />
    <meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link
      rel="preload"
      href="./fonts/archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Resolve the theme before the first paint. React only learns the
      // preference after it mounts, and a light-theme user would otherwise get
      // a full dark frame on every launch - a flash on an app that is opened at
      // a table, in a dim room, mid-scene.
      try {
        var p = JSON.parse(localStorage.getItem('dhc.prefs.v1') || '{}');
        var t = p.theme || 'dark';
        document.documentElement.dataset.theme =
          t === 'system'
            ? matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
