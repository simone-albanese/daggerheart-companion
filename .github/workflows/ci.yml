name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Bounded because it was not: on 19 August two consecutive runs sat on
    # `apt-get update` for over ten minutes each with no timeout, and the
    # default is six hours. A hang should cost minutes and say so.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `.nvmrc` is the one place the Node version is written down. It is
          # read here rather than repeated, because the literal that used to sit
          # on this line disagreed with package.json, with env.sh and with the
          # machine the project is developed on, and nothing could notice.
          node-version-file: '.nvmrc'
          cache: npm

      # The SRD PDF is not in the repo and never will be - `.gitignore` opens
      # with `*.pdf`. Everything downstream that needs it is gated on this, so a
      # stock runner skips those steps instead of failing four steps later with
      # something that looks like a parser bug.
      #
      # This probe runs FIRST because the poppler install below is gated on it.
      # It only tests for two files, so it needs neither `npm ci` nor poppler.
      - name: Look for the SRD PDF
        id: srd
        run: |
          if [ -f "Manuali/Daggerheart-SRD-9-09-25.pdf" ] \
            || [ -f "tools/.cache/Daggerheart-SRD-9-09-25.pdf" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SRD PDF absent::Re-extraction is skipped. The app builds against the committed data/srd-1.0.json; parser tests that need the PDF skip themselves."
          fi

      # pdftotext and pdftohtml, for tools/loadSrd.ts. This used to run
      # unconditionally, "so that the moment a runner does have the SRD PDF,
      # extraction works rather than failing on a missing binary" - and the
      # condition for that moment is exactly the probe above, so the intent is
      # kept and the cost is not. No runner has the PDF, so every run was paying
      # an `apt-get update` for the one step it enables, which is itself gated
      # on the same output and therefore always skipped. On 19 August that
      # unconditional apt hung twice in a row and blocked the only workflow that
      # typechecks.
      - name: Install poppler-utils
        if: steps.srd.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - run: npm ci

      # That JSON, unlike the PDF, is a committed build artifact: without it the
      # app has no rules at all, and tsc would only say "cannot find module".
      - name: Check the committed dataset
        run: |
          if [ ! -f "data/srd-1.0.json" ]; then
            echo "::error title=Missing dataset::data/srd-1.0.json is a committed build artifact and it is absent. Regenerate it with 'npm run build:srd' (needs the SRD PDF) and commit the result."
            exit 1
          fi

      # WHAT GATES THIS REPO, AND WHAT DOES NOT
      #
      # There is no linter anywhere in this tree. That is a fact worth writing
      # down rather than an oversight for the next reader to correct in passing,
      # because three separate steps have now rediscovered it one at a time.
      # Measured on this commit: `package.json` declares nine scripts - dev,
      # build, preview, build:srd, build:registry, build:icons, test, test:watch,
      # typecheck - and `lint` is not among them; there is no `eslint.config.*`
      # and no `.eslintrc*` at any depth outside `node_modules`; and `npx eslint .`
      # answers "ESLint couldn't find an eslint.config.* file".
      #
      # So everything a linter would ordinarily hold is held by the steps in
      # this job and by nothing else. On a stock runner that is five: the
      # dataset check above, `tsc --noEmit` under this repo's strict options,
      # `vitest run`, `node --check public/sw.js` with its placeholder grep, and
      # `vite build`. The sixth, the SRD re-extraction, is gated on a PDF that
      # the first line of `.gitignore` keeps out of the repo, so it does not run
      # here.
      #
      # What that leaves uncovered is real, and larger than "tsc catches most of
      # it": `tsconfig.json` sets neither `noUnusedLocals` nor
      # `noUnusedParameters`, so dead locals and dead imports pass this job in
      # silence. One was standing in `tests/store/campaignSchema.test.ts` when
      # this comment was written - `SCHEMA_VERSION` was imported and named only
      # inside comment prose - and it was found by reading the file, not by any
      # gate. Add import hygiene, accessibility rules and every React-hooks rule
      # to the list.
      #
      # Some of that ground is held instead by tests written against this repo's
      # own source, which is why those tests are shaped the way they are rather
      # than being ordinary unit tests: `campaignUrlRow.test.ts` scans `src/` and
      # `shared/` for HTML sinks, `orphans.test.ts` hunts exports nothing
      # reaches, and `campaignSchema.test.ts` reads `newCampaign` to check which
      # of the two schema constants it stamps - a property no runtime assertion
      # can see while both constants read 5.
      #
      # Installing a linter is a decision, and it is the owner's. Do not add one
      # in order to close this comment.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # The service worker is plain JS in public/, so neither tsc nor vitest
      # ever looks at it. A syntax error there is invisible until it is live.
      # The placeholder is checked here rather than only at deploy time: losing
      # it is silent - the site still builds and still works - and the cost is
      # that no installed client ever updates again.
      - name: Check the service worker
        run: |
          node --check public/sw.js
          grep -q '__BUILD__' public/sw.js || {
            echo "::error title=Service worker not stampable::public/sw.js has no __BUILD__ placeholder for deploy.yml to stamp, so every deploy would ship a byte-identical worker and no installed client would ever update."
            exit 1
          }

      - name: Build
        run: npx vite build

      # Only reachable on a runner that has been given the PDF. It proves the
      # parsers still produce exactly the dataset that is committed, which is
      # the one thing a stock runner cannot check.
      - name: Re-extract the SRD and diff it against the committed dataset
        if: steps.srd.outputs.present == 'true'
        run: |
          npm run build:srd
          git diff --exit-code -- data/ || {
            echo "::error title=Dataset out of date::The parsers no longer produce the committed data/srd-1.0.json. Run 'npm run build:srd' and commit the result."
            exit 1
          }
